name: iOS App — Build Check

on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
    pull_request_target:

jobs:
    ios-app:
        runs-on: ubuntu-latest
        # Device tests run locally against real simulators — this job checks compilation and lint only.
        if: github.actor != 'dependabot[bot]' && github.event_name == 'pull_request'
        steps:
            - name: ⬇️ Checkout Repository
              uses: actions/checkout@v4

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"

            - name: 🧩 Install Dependencies
              run: npm ci

            - name: 🔍 Type Check
              run: npx tsc --noEmit

            - name: 🧹 Lint
              run: npm run lint
